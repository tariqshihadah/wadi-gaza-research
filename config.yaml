# ---------------------------------------------------------------------------
# Sentinel-2 acquisition configuration
# Edit THIS file to add sites, dates, or years. You should not need to touch
# the Python script for routine changes.
# ---------------------------------------------------------------------------

# Path to your polygon shapefile (relative to where you run the script, or absolute).
shapefile: "sites/my_sites.shp"

# Name of the attribute column used to label output files (e.g. a site code).
# Set to null to fall back to the feature's row index.
site_id_field: "site_id"

# Where GeoTIFFs are written. One subfolder per site is created automatically.
output_dir: "outputs"

# Output ground resolution in metres. Sentinel-2's finest native bands are 10 m.
resolution: 10

# Skip acquisitions cloudier than this (percent, scene-level metadata filter).
max_cloud_cover: 30

# "per_scene"  -> one GeoTIFF per qualifying acquisition date (full time series)
# "composite"  -> one least-cloudy mosaic per date window
mode: "per_scene"

# Date windows to search. ADD A LINE HERE to extend to new periods/years.
# Format: [start_date, end_date]  (YYYY-MM-DD, inclusive)
date_windows:
  - ["2023-06-01", "2023-08-31"]
  - ["2024-06-01", "2024-08-31"]
  - ["2025-06-01", "2025-08-31"]
