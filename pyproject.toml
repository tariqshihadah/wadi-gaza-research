[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wadi-gaza-research"
version = "0.1.0"
description = "Research workflows for Sentinel-2 imagery and spatially adjusted index and change estimates"
dependencies = [
    "sentinelhub>=3.9",
    "affine",
    "geopandas",
    "rasterio",
    "pyproj",
    "shapely",
    "numpy",
    "scipy",
    "statsmodels>=0.15",
    "pandas",
    "matplotlib",
    "PyYAML",
    "python-dotenv",
    "cdsapi>=0.7",
    "xarray",
    "netCDF4",
]

[project.optional-dependencies]
dev = ["ipykernel", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cds_pull*", "change_ci*", "change_did*", "spatial_ci*", "index_ci*", "plot_style*", "s2grab*"]
